        /* =========================
           GENERAL
           ========================= */

        body {
            margin: 0;
            min-height: 100vh;

            background-color: #353D4D;
            color: white;

            font-family: Arial, sans-serif;
        }


        /* =========================
           HEADER
           ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 30px;

            padding: 30px 20px 50px 20px;
        }


        .logo {
            width: 100px;
            height: 100px;

            object-fit: contain;
        }


        h1 {
            margin: 0;

            font-size: 48px;
            font-weight: bold;

            text-align: center;
        }


        /* =========================
           VIDEO GRID
           ========================= */

        .video-grid {
            width: 90%;
            max-width: 1400px;

            margin: 0 auto;

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 25px;

            padding-bottom: 50px;
        }


        /* =========================
           VIDEO CARD
           ========================= */

        .video-card {
            background-color: #6CA39E;

            border-radius: 12px;

            overflow: hidden;

            transition: transform 0.2s ease;
        }


        .video-card:hover {
            transform: translateY(-5px);
        }


        /* =========================
           VIDEO PREVIEW
           ========================= */

       /* =========================
   VIDEO PREVIEW
   ========================= */

.video-preview-wrapper {
    position: relative;

    width: 100%;
    aspect-ratio: 16 / 9;

    overflow: hidden;

    background-color: #222;

    cursor: pointer;
}

.video-preview {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;

    object-position: center;

    cursor: pointer;
}

        /* =========================
           PLAY BUTTON
           ========================= */

        .play-button {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 65px;
            height: 65px;

            border-radius: 50%;

            background-color: rgba(0, 0, 0, 0.65);

            display: flex;

            align-items: center;
            justify-content: center;

            pointer-events: none;

            transition: transform 0.2s ease,
                        background-color 0.2s ease;
        }


        .play-button::after {
            content: "";

            margin-left: 5px;

            border-top: 13px solid transparent;
            border-bottom: 13px solid transparent;
            border-left: 21px solid white;
        }


        .video-preview-wrapper:hover .play-button {
            transform: translate(-50%, -50%) scale(1.1);

            background-color: rgba(0, 0, 0, 0.8);
        }


        /* =========================
           VIDEO TITLE
           ========================= */

        .video-title {
            padding: 15px;

            font-size: 20px;
            font-weight: bold;

            text-align: center;
        }


        /* =========================
           VIDEO POPUP BACKGROUND
           ========================= */

        .video-popup {
            display: none;

            position: fixed;

            z-index: 1000;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color: rgba(0, 0, 0, 0.8);

            align-items: center;
            justify-content: center;
        }


        .video-popup.active {
            display: flex;
        }


        /* =========================
           POPUP VIDEO CONTAINER
           ========================= */

        .popup-content {
            position: relative;

            width: 75vw;
            height: 75vh;

            background-color: #222;

            border-radius: 12px;

            overflow: hidden;

            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }


        /* =========================
           POPUP VIDEO
           ========================= */

        .popup-content video {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: contain;

            background-color: #111;
        }


        /* =========================
           CLOSE BUTTON
           ========================= */

        .close-button {
            position: absolute;

            top: 10px;
            right: 15px;

            z-index: 1001;

            width: 40px;
            height: 40px;

            border: none;

            border-radius: 50%;

            background-color: rgba(0, 0, 0, 0.7);

            color: white;

            font-size: 28px;

            line-height: 40px;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        .close-button:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }


        /* =========================
           TABLET
           ========================= */

        @media (max-width: 1000px) {

            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }


            h1 {
                font-size: 36px;
            }


            .logo {
                width: 80px;
                height: 80px;
            }


            .popup-content {
                width: 85vw;
                height: 70vh;
            }

        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .header {
                gap: 10px;

                padding-top: 20px;
                padding-bottom: 30px;
            }


            .video-grid {
                grid-template-columns: 1fr;

                width: 90%;
            }


            .logo {

            }

            }

            }

            }


            .play-button::after {
                border-top-width: 10px;
                border-bottom-width: 10px;
                border-left-width: 17px;
            }

        }

                aria-label="Luk video"

    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        const popup = document.getElementById("videoPopup");

        const popupVideo = document.getElementById("popupVideo");


        /*
         * OPEN VIDEO
         */

        function openVideo(videoFile) {

            // Make sure any previous video is stopped
            popupVideo.pause();

            // Set the new video
            popupVideo.src = videoFile;

            // Show popup
            popup.classList.add("active");

            // Prevent the page from scrolling
            document.body.style.overflow = "hidden";

            // Load the selected MP4
            popupVideo.load();

            /*
             * Start playing the video.
             * The play() call happens directly from the
             * click that opened the video.
             */
            const playPromise = popupVideo.play();

            if (playPromise !== undefined) {

                playPromise.catch(function(error) {

                    console.log(
                        "Video could not start automatically:",
                        error
                    );

                });

            }

        }


        /*
         * CLOSE VIDEO
         */

        function closeVideo() {

            // Stop playback
            popupVideo.pause();

            // Reset playback position
            popupVideo.currentTime = 0;

            // Remove the video
            popupVideo.removeAttribute("src");

            // Reset the video element
            popupVideo.load();

            // Hide popup
            popup.classList.remove("active");

            // Allow page scrolling again
            document.body.style.overflow = "";

        }


        /*
         * CLOSE WHEN CLICKING OUTSIDE
         */

        function closeVideoOutside(event) {

            // Only close if the dark background itself
            // was clicked.

            if (event.target === popup) {

                closeVideo();

            }

        }


        /*
         * CLOSE WITH ESCAPE
         */

        document.addEventListener("keydown", function(event) {

            if (
                event.key === "Escape" &&
                popup.classList.contains("active")
            ) {

                closeVideo();

            }

        });


        /*
         * IF VIDEO FINISHES
         *
         * The video stays open so the visitor can replay it
         * using the controls.
         */

        popupVideo.addEventListener("ended", function() {

            popupVideo.currentTime = 0;

        });

    </script>
