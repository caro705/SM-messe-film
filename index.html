
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Special Minds - messe</title>

    <style>
        /* =========================
           GENERAL
           ========================= */

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #353D4D;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* =========================
           HEADER
           ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 30px 20px 50px;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        h1 {
            margin: 0;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
        }

        /* =========================
           VIDEO GRID
           ========================= */

        .video-grid {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            padding-bottom: 50px;
        }

        /* =========================
           VIDEO CARDS
           ========================= */

        .video-card {
            background-color: #6CA39E;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-5px);
        }

        .video-preview-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #222;
            cursor: pointer;
        }

        .video-preview {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            object-position: center;
            background-color: #222;
            cursor: pointer;
        }

        /* =========================
           PLAY BUTTON
           ========================= */

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: 0.2s ease;
        }

        .play-button::after {
            content: "";
            margin-left: 5px;
            border-top: 13px solid transparent;
            border-bottom: 13px solid transparent;
            border-left: 21px solid white;
        }

        .video-preview-wrapper:hover .play-button {
            background-color: rgba(0, 0, 0, 0.8);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .video-title {
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        /* =========================
           POPUP BACKGROUNDS
           ========================= */

        .video-popup,
        .contact-popup {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
        }

        .video-popup.active,
        .contact-popup.active {
            display: flex;
        }

        /* =========================
           VIDEO POPUP
           ========================= */

        .popup-content {
            position: relative;
            width: 75vw;
            height: 75vh;
            background-color: #222;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }

        .popup-content video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background-color: #111;
        }

        /* =========================
           CLOSE BUTTON
           ========================= */

        .close-button {
            position: absolute;
            top: 10px;
            right: 15px;
            z-index: 1001;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-button:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        /* =========================
           CONTACT BUTTON
           ========================= */

        .contact-section {
            display: flex;
            justify-content: center;
            padding: 10px 20px 70px;
        }

        .contact-button {
            background-color: #6CA39E;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 20px 50px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .contact-button:hover {
            background-color: #578b86;
            transform: scale(1.05);
        }

        /* =========================
           CONTACT POPUP - 80%
           ========================= */

        .contact-content {
            position: relative;
            box-sizing: border-box;
            width: 80vw;
            height: 80vh;
            background-color: #353D4D;
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }

        .contact-content h2 {
            margin: 0 45px 20px;
            text-align: center;
            font-size: 28px;
        }

        .contact-content iframe {
            width: 100%;
            flex: 1;
            min-height: 0;
            border: none;
            border-radius: 8px;
            background-color: white;
        }

        .contact-fallback {
            text-align: center;
            font-size: 14px;
            margin: 12px 0 0;
        }

        .contact-fallback a {
            color: white;
            text-decoration: underline;
        }

        /* =========================
           TABLET
           ========================= */

        @media (max-width: 1000px) {

            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 36px;
            }

            .logo {
                width: 80px;
                height: 80px;
            }

            .popup-content {
                width: 85vw;
                height: 70vh;
            }
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .header {
                gap: 10px;
                padding: 20px 10px 30px;
            }

            .video-grid {
                grid-template-columns: 1fr;
                width: 90%;
            }

            .logo {
                width: 55px;
                height: 55px;
            }

            h1 {
                font-size: 25px;
            }

            .popup-content {
                width: 95vw;
                height: 65vh;
            }

            .play-button {
                width: 50px;
                height: 50px;
            }

            .play-button::after {
                border-top-width: 10px;
                border-bottom-width: 10px;
                border-left-width: 17px;
            }

            .contact-content {
                width: 95vw;
                height: 90vh;
                padding: 15px;
            }

            .contact-content h2 {
                font-size: 22px;
            }

            .contact-button {
                font-size: 20px;
                padding: 18px 35px;
            }
        }

        /* MESSESKAERM: Bevar 16:9 og tilpas hele oversigten til hoejden.
           Paa meget smaa/lave skaerme bruges normal scrolling. */
        @media (min-width: 1001px) and (min-height: 621px) {
            body {
                box-sizing: border-box;
                height: 100vh;
                height: 100dvh;
                min-height: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-between;
                overflow: hidden;
            }

            .header {
                flex: 0 0 auto;
                padding: clamp(8px, 1.5vh, 18px) 15px;
                gap: clamp(12px, 2vw, 30px);
            }

            .logo {
                width: clamp(45px, 7vh, 85px);
                height: clamp(45px, 7vh, 85px);
            }

            h1 { font-size: clamp(24px, 3.5vh, 44px); }

            .video-grid {
                flex: 0 1 auto;
                box-sizing: border-box;
                /* 3 raekker x (9/16) x (bredde/4) = bredde x 27/64.
                   280px reserveres til overskrift, titler, mellemrum og knap. */
                width: min(90vw, 1400px, calc((100dvh - 280px) * 64 / 27));
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: clamp(7px, 1vh, 15px);
                padding-bottom: 0;
            }

            .video-title {
                padding: clamp(5px, 0.8vh, 10px) 5px;
                font-size: clamp(13px, 1.7vh, 19px);
                line-height: 1.15;
            }

            .contact-section {
                flex: 0 0 auto;
                padding: clamp(8px, 1.3vh, 16px) 15px;
            }

            .contact-button {
                padding: clamp(10px, 1.4vh, 17px) 35px;
                font-size: clamp(17px, 2vh, 23px);
            }
        }
    </style>
</head>

    <!-- =========================
         CONTACT POPUP
         ========================= -->

    <div
        class="contact-popup"
        id="contactPopup"
        onclick="closeContactOutside(event)"
    >

        <div
            class="contact-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="contactTitle"
        >

            <button
                class="close-button"
                type="button"
                onclick="closeContact()"
                aria-label="Luk kontaktformular"
            >
                &times;
            </button>

                Vil du kontaktes?
            </h2>

            <!-- PUBLISHED GOOGLE FORM -->

                id="contactFrame"
                title="Special Minds kontaktformular"

                loading="lazy"
            ></iframe>

                Hvis formularen ikke vises,
                <a
                    href="https://docs.google.com/forms/d/e/1FAIpQLScRsef3-vVI-CyYLCyyWErYBxVFewoeyVLj3hJiXdM94jFMBg/viewform"

         VIDEO POPUP
         ========================= -->

        class="video-popup"
        id="videoPopup"
        onclick="closeVideoOutside(event)"
    >

            <button
                class="close-button"
                type="button"
                onclick="closeVideo()"
                aria-label="Luk video"
            >
                &times;
            </button>

            <video
                id="popupVideo"
                controls
                playsinline
            ></video>

        </div>

    </div>

    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        const popup =
            document.getElementById("videoPopup");

        const popupVideo =
            document.getElementById("popupVideo");

        const contactPopup =
            document.getElementById("contactPopup");

        let previousContactFocus = null;

        /* Faelles lydforstaerkning til alle videoer i popup-vinduet.
           1.5 = 150 % signalniveau. Kan give forvraengning ved hoeje lyde. */
        const VIDEO_GAIN = 1.5;
        let videoAudioContext = null;
        let videoGainNode = null;

        function enableVideoBoost() {
            try {
                if (!videoAudioContext) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContextClass) return; // Browseren bruger normal lyd

                    videoAudioContext = new AudioContextClass();
                    const source = videoAudioContext.createMediaElementSource(popupVideo);
                    videoGainNode = videoAudioContext.createGain();
                    videoGainNode.gain.value = VIDEO_GAIN;
                    source.connect(videoGainNode);
                    videoGainNode.connect(videoAudioContext.destination);
                }
                if (videoAudioContext.state === "suspended") {
                    videoAudioContext.resume().catch(console.warn);
                }
            } catch (error) {
                console.warn("Lydforstaerkning kunne ikke aktiveres:", error);
            }
        }


        /* =========================
           OPEN VIDEO
           ========================= */

        function openVideo(videoFile) {

            popupVideo.pause();
            popupVideo.volume = 1;
            enableVideoBoost();

            popupVideo.src = videoFile;

            popup.classList.add("active");

            document.body.style.overflow = "hidden";

            popupVideo.load();

            const playPromise = popupVideo.play();

            if (playPromise !== undefined) {

                playPromise.catch(function(error) {

                    console.log(
                        "Video could not start automatically:",
                        error
                    );

                });
            }
        }

        /* =========================
           CLOSE VIDEO
           ========================= */

        function closeVideo() {

            popupVideo.pause();

            popupVideo.removeAttribute("src");

            popupVideo.load();

            popup.classList.remove("active");

            document.body.style.overflow = "";
        }

        /* =========================
           CLOSE VIDEO OUTSIDE
           ========================= */

        function closeVideoOutside(event) {

            if (event.target === popup) {
                closeVideo();
            }
        }

        /* =========================
           CLOSE WHEN VIDEO ENDS
           ========================= */

        popupVideo.addEventListener("ended", function() {

            console.log("Video finished playing");

            closeVideo();
        });

        /* =========================
           OPEN CONTACT POPUP
           ========================= */

        function openContact() {

            previousContactFocus = document.activeElement;

            contactPopup.classList.add("active");

            document.body.style.overflow = "hidden";

            contactPopup
                .querySelector(".close-button")
                .focus();
        }

        /* =========================
           CLOSE CONTACT POPUP
           ========================= */

        function closeContact() {

            contactPopup.classList.remove("active");

            document.body.style.overflow = "";

            if (previousContactFocus) {
                previousContactFocus.focus();
            }
        }

        /* =========================
           CLOSE CONTACT OUTSIDE
           ========================= */

        function closeContactOutside(event) {

            if (event.target === contactPopup) {
                closeContact();
            }
        }

        /* =========================
           CLOSE WITH ESCAPE
           ========================= */

        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {

                if (contactPopup.classList.contains("active")) {
                    closeContact();
                }

                if (popup.classList.contains("active")) {
                    closeVideo();
                }
            }
        });

    </script>
