<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Minds - messe</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #353D4D;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 30px 20px 50px 20px;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        h1 {
            margin: 0;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
        }

        /* VIDEO GRID */
        .video-grid {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            gap: 25px;
            padding-bottom: 50px;
        }

        .video-card {
            background-color: #6CA39E;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-5px);
        }

        /* IMAGE PREVIEW */
        .video-preview {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            object-fit: cover;
            background-color: #222;
            cursor: pointer;
        }

        .video-title {
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        /* =========================
           VIDEO POPUP
           ========================= */

        .video-popup {
            display: none;

            position: fixed;
            z-index: 1000;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color: rgba(0, 0, 0, 0.8);

            align-items: center;
            justify-content: center;
        }

        .video-popup.active {
            display: flex;
        }

        .popup-content {
            position: relative;

            width: 75vw;
            height: 75vh;

            background-color: #222;

            border-radius: 12px;
            overflow: hidden;

            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }

        .popup-content video {
            width: 100%;
            height: 100%;

            object-fit: contain;

            background-color: #111;
        }

        /* CLOSE BUTTON */
        .close-button {
            position: absolute;

            top: 10px;
            right: 15px;

            z-index: 1001;

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;

            background-color: rgba(0, 0, 0, 0.7);
            color: white;

            font-size: 28px;
            line-height: 40px;

            cursor: pointer;
        }

        .close-button:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        /* TABLET */
        @media (max-width: 1000px) {

            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 36px;
            }

            .logo {
                width: 80px;
                height: 80px;
            }

            .popup-content {
                width: 85vw;
                height: 70vh;
            }
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .header {
                gap: 10px;
                padding-top: 20px;
                padding-bottom: 30px;
            }

            .video-grid {
                grid-template-columns: 1fr;
                width: 90%;
            }

            .logo {
                width: 55px;
                height: 55px;
            }

            h1 {
                font-size: 25px;
            }

            .popup-content {
                width: 95vw;
                height: 65vh;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <img src="sp.m logo - messe.png" alt="Logo" class="logo">

                src="preview4.jpg"

        <!-- VIDEO 6 -->

        <!-- VIDEO 8 -->

            <div class="video-title">Ungdomsliv</div>
        </div>

    </main>


    <!-- VIDEO POPUP -->
    <div
        class="video-popup"
        id="videoPopup"
        onclick="closeVideoOutside(event)"
    >

        <div class="popup-content">

            <button
                class="close-button"
                onclick="closeVideo()"
            >
                &times;
            </button>

            <video
                id="popupVideo"
                controls
            >
            </video>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        const popup = document.getElementById("videoPopup");
        const popupVideo = document.getElementById("popupVideo");


        function openVideo(videoFile) {

            // Set the selected video
            popupVideo.src = videoFile;

            // Show popup
            popup.classList.add("active");

            // Prevent background scrolling
            document.body.style.overflow = "hidden";

            // Start video
            popupVideo.play();
        }


        function closeVideo() {

            // Stop video
            popupVideo.pause();

            // Reset video
            popupVideo.currentTime = 0;

            // Remove video source
            popupVideo.removeAttribute("src");
            popupVideo.load();

            // Hide popup
            popup.classList.remove("active");

            // Allow scrolling again
            document.body.style.overflow = "";
        }


        function closeVideoOutside(event) {

            // Only close when the dark background is clicked
            if (event.target === popup) {
                closeVideo();
            }

        }


        // Close popup with ESC
        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                closeVideo();
            }

        });

    </script>

</body>
</html>
